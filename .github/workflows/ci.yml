name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb"
      CI: true
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: "1.1.0"

    - name: Install dependencies
      run: bun install

    - name: Generate Prisma Client
      run: bun run db:generate

    - name: Lint
      run: bun run lint

    - name: Test
      run: bun run test

    - name: Build
      run: bun run build
