name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: 'postgresql://postgres:password@localhost:5432/testdb'
      REDIS_URL: 'redis://localhost:6379'
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache Prettier
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/prettier
          key: ${{ runner.os }}-prettier-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-prettier-

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: apps/web-app/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web-app/src/**/*', 'apps/web-app/app/**/*', 'apps/web-app/next.config.mjs', 'apps/web-app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: bun run format:check

      - name: Check DeveloperFollowMe drift
        run: bun run docs:devfollowme:check

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Lint Root
        run: bun x eslint . --ext .js,.jsx,.ts,.tsx --max-warnings=0

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
